[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berkeleyauv-intro-perception"
version = "0.1.0"
description = "Berkeley AUV perception onboarding scaffold"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]
yolo = ["ultralytics==8.4.104"]

[project.scripts]
intro-perception-run = "intro_perception.run:main"
intro-perception-vis = "intro_perception.visualize:main"
intro-perception-evaluate = "intro_perception.evaluate:main"
intro-perception-data = "intro_perception.data_tools:main"
intro-perception-train = "intro_perception.train:main"

[tool.setuptools.packages.find]
include = ["intro_perception*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
